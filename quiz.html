<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>EduVerse X | الكويزات الذكية - أسئلة مترجمة بالكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #050a12;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        body.light-mode {
            background: #f0f2f5;
            color: #1a1a2e;
        }
        body.light-mode .navbar { background: rgba(255, 255, 255, 0.95); border-bottom-color: #4f9cff; }
        body.light-mode .subject-btn, body.light-mode .lesson-btn, body.light-mode .quiz-settings { background: rgba(255, 255, 255, 0.8); color: #1a1a2e; }
        body.light-mode .subject-btn.active, body.light-mode .lesson-btn.active { background: linear-gradient(135deg, #4f9cff, #3b82f6); color: white; }
        body.light-mode .question-card { background: rgba(255, 255, 255, 0.9); color: #1a1a2e; }
        body.light-mode .option-btn { background: rgba(200, 200, 210, 0.8); color: #1a1a2e; }
        body.light-mode .stat-badge { background: rgba(79, 156, 255, 0.2); color: #2563eb; }
        body.light-mode .feedback-area { background: rgba(0, 0, 0, 0.05); }
        body.light-mode .quiz-area { background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(240, 242, 245, 0.8)); border-color: #4f9cff; }
        body.light-mode .question-text { color: #1a1a2e; }
        body.light-mode #canvas-bg { opacity: 0.2; }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .content {
            position: relative;
            z-index: 10;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 60px;
            background: rgba(5, 10, 18, 0.85);
            backdrop-filter: blur(25px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(79, 156, 255, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon { font-size: 32px; filter: drop-shadow(0 0 10px #4f9cff); animation: floatIcon 3s ease-in-out infinite; }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        .logo-text { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #4f9cff, #a855f7, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }

        .nav-links {
            display: flex;
            gap: 35px;
            align-items: center;
        }
        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            padding: 5px 0;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #4f9cff, #a855f7);
            transition: 0.3s;
        }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
        .nav-links a:hover, .nav-links a.active { color: #4f9cff; }
        
        .lang-btn, .mode-btn {
            background: rgba(79, 156, 255, 0.2);
            border: 1px solid rgba(79, 156, 255, 0.4);
            padding: 8px 20px;
            border-radius: 40px;
            color: #4f9cff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .lang-btn:hover, .mode-btn:hover { background: rgba(79, 156, 255, 0.4); transform: scale(1.05); }

        .container { max-width: 1300px; margin: 0 auto; padding: 50px 40px; }
        
        .hero {
            text-align: center;
            margin-bottom: 50px;
            padding: 50px 30px;
            background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(79, 156, 255, 0.15), transparent);
            border-radius: 70px;
        }
        .hero h1 { font-size: 3.2rem; font-weight: 800; background: linear-gradient(135deg, #ffffff, #4f9cff, #a855f7, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .hero p { color: #94a3b8; font-size: 1.2rem; }

        .subject-selector {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .subject-btn {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(79, 156, 255, 0.25);
            padding: 18px 40px;
            border-radius: 80px;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.4s;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .subject-btn.active {
            background: linear-gradient(135deg, #4f9cff, #3b82f6);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 35px rgba(79, 156, 255, 0.5);
        }

        .lesson-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 80px;
            display: none;
        }
        .lesson-selector.active { display: flex; }
        .lesson-btn {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(79, 156, 255, 0.2);
            padding: 10px 28px;
            border-radius: 50px;
            color: #cbd5e1;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .lesson-btn.active {
            background: linear-gradient(135deg, #4f9cff, #3b82f6);
            color: white;
        }
        .lesson-btn:hover:not(.active) {
            border-color: #4f9cff;
            color: #4f9cff;
        }

        .quiz-settings {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 35px;
            margin-bottom: 45px;
            text-align: center;
        }
        .quiz-settings h3 { color: #4f9cff; margin-bottom: 25px; font-size: 1.5rem; }
        .settings-row { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-bottom: 30px; }
        .setting-item { display: flex; flex-direction: column; gap: 10px; }
        .setting-item label { color: #94a3b8; font-size: 14px; }
        .setting-item select {
            background: rgba(5, 10, 18, 0.9);
            border: 1px solid rgba(79, 156, 255, 0.4);
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .generate-btn {
            background: linear-gradient(135deg, #4f9cff, #3b82f6);
            border: none;
            padding: 16px 50px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .generate-btn:hover { transform: scale(1.05); box-shadow: 0 10px 35px rgba(79, 156, 255, 0.5); }

        .quiz-area {
            display: none;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.7), rgba(5, 10, 18, 0.5));
            backdrop-filter: blur(25px);
            border-radius: 55px;
            padding: 40px;
            border: 1px solid rgba(79, 156, 255, 0.3);
            animation: fadeInUp 0.6s ease;
        }
        .quiz-area.active { display: block; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .quiz-header h2 { color: #4f9cff; font-size: 1.7rem; }
        .quiz-stats { display: flex; gap: 20px; }
        .stat-badge {
            background: rgba(79, 156, 255, 0.15);
            padding: 10px 22px;
            border-radius: 50px;
            color: #4f9cff;
            font-weight: bold;
            border: 1px solid rgba(79, 156, 255, 0.2);
        }
        .progress-bar {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            height: 10px;
            margin-bottom: 35px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #4f9cff, #22d3ee);
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;
        }

        .question-card {
            background: rgba(10, 15, 30, 0.7);
            border-radius: 40px;
            padding: 35px;
            margin-bottom: 30px;
            border: 1px solid rgba(79, 156, 255, 0.15);
        }
        .question-text {
            font-size: 1.4rem;
            margin-bottom: 30px;
            line-height: 1.7;
            padding-right: 15px;
            border-right: 4px solid #4f9cff;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: rgba(20, 30, 45, 0.8);
            border: 1px solid rgba(79, 156, 255, 0.2);
            padding: 18px 22px;
            border-radius: 25px;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s;
            color: #cbd5e1;
        }
        .option-btn:hover { border-color: #4f9cff; transform: translateX(-5px); background: rgba(79, 156, 255, 0.12); }
        .option-btn.correct { background: linear-gradient(135deg, rgba(34, 197, 94, 0.3), rgba(34, 197, 94, 0.1)); border-color: #22c55e; }
        .option-btn.wrong { background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(239, 68, 68, 0.1)); border-color: #ef4444; }
        
        .feedback-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 25px;
            padding: 18px;
            margin-top: 20px;
            font-size: 14px;
        }
        .feedback-correct { color: #4ade80; }
        .feedback-wrong { color: #f87171; }

        .next-btn {
            background: linear-gradient(135deg, #4f9cff, #3b82f6);
            border: none;
            padding: 16px 35px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .next-btn:hover:not(.disabled) { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(79,156,255,0.4); }
        .next-btn.disabled { opacity: 0.5; cursor: not-allowed; }

        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.97);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .result-modal.active { display: flex; animation: fadeInScale 0.4s ease; }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .result-card {
            background: linear-gradient(135deg, #0f172a, #0a0c15);
            border-radius: 60px;
            padding: 50px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            border: 2px solid #4f9cff;
        }
        .result-card h2 { color: #4f9cff; font-size: 2.2rem; }
        .result-score { font-size: 3.5rem; font-weight: 900; background: linear-gradient(135deg, #ffd700, #ffaa00); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 20px 0; }
        .result-btn {
            background: linear-gradient(135deg, #4f9cff, #3b82f6);
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
            transition: 0.3s;
        }
        .result-btn:hover { transform: scale(1.05); }
        footer { text-align: center; padding: 45px; border-top: 1px solid rgba(79, 156, 255, 0.1); color: #475569; margin-top: 50px; }

        @media (max-width: 768px) {
            .navbar { padding: 12px 20px; }
            .hero h1 { font-size: 2rem; }
            .container { padding: 30px 20px; }
            .options-grid { grid-template-columns: 1fr; }
            .subject-btn { padding: 12px 25px; font-size: 0.9rem; }
            .quiz-header h2 { font-size: 1.2rem; }
            .stat-badge { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="content">
    <div class="navbar">
        <div class="logo"><span class="logo-icon">✨</span><span class="logo-text" id="logoText">Quick-Edu</span></div>
        <div class="nav-links">
            <a href="chemistry.html" id="homeLink">الرئيسية</a>
            <a href="lessons.html" id="lessonsLink">الدروس</a>
            <a href="quiz.html" class="active" id="quizLink">الكويزات</a>
            <a href="contact.html" id="contactLink">التواصل</a>
            <button class="mode-btn" id="modeToggle">🌙</button>
            <button class="lang-btn" id="langToggle">🇬🇧 English</button>
        </div>
    </div>

    <div class="container">
        <div class="hero">
            <h1 id="heroTitle">📝 اختبر نفسك</h1>
            <p id="heroSubtitle">أسئلة متنوعة ومتجددة في الكيمياء والمحاسبة - اختر عدد الأسئلة الذي يناسبك</p>
        </div>

        <div class="subject-selector">
            <button class="subject-btn active" data-subject="chemistry" id="chemistrySubjectBtn">
                <span>🧪</span> <span id="chemistryText">الكيمياء - العناصر الانتقالية</span>
            </button>
            <button class="subject-btn" data-subject="accounting" id="accountingSubjectBtn">
                <span>📊</span> <span id="accountingText">المحاسبة - القوائم المالية</span>
            </button>
        </div>

        <div class="lesson-selector" id="lessonSelector">
            <button class="lesson-btn active" data-lesson="1" id="lesson1Btn">🔬 <span>الدرس 1: مقدمة العناصر</span></button>
            <button class="lesson-btn" data-lesson="2" id="lesson2Btn">⚡ <span>الدرس 2: خواص العناصر</span></button>
            <button class="lesson-btn" data-lesson="3" id="lesson3Btn">📝 <span>الدرس 3: التوزيع الإلكتروني</span></button>
            <button class="lesson-btn" data-lesson="4" id="lesson4Btn">🎨 <span>الدرس 4: ألوان الأيونات</span></button>
        </div>

        <div class="quiz-settings">
            <h3 id="settingsTitle">⚙️ إعدادات الاختبار</h3>
            <div class="settings-row">
                <div class="setting-item">
                    <label id="questionsLabel">📊 عدد الأسئلة</label>
                    <select id="questionCount">
                        <option value="3">3 أسئلة</option>
                        <option value="5">5 أسئلة</option>
                        <option value="10" selected>10 أسئلة</option>
                        <option value="15">15 سؤال</option>
                        <option value="20">20 سؤال</option>
                        <option value="30">30 سؤال</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label id="difficultyLabel">⭐ مستوى الصعوبة</label>
                    <select id="difficulty">
                        <option value="easy" id="easyOption">سهل</option>
                        <option value="medium" selected id="mediumOption">متوسط</option>
                        <option value="hard" id="hardOption">صعب</option>
                    </select>
                </div>
            </div>
            <button class="generate-btn" id="generateQuizBtn">🚀 <span id="generateText">بدء الاختبار بأسئلة متنوعة</span></button>
        </div>

        <div id="quizArea" class="quiz-area">
            <div class="quiz-header">
                <h2 id="quizTitle">📖 اختبار متنوع</h2>
                <div class="quiz-stats">
                    <div class="stat-badge"><span id="scoreLabel">⭐ النقاط</span>: <span id="currentScore">0</span></div>
                    <div class="stat-badge"><span id="questionLabel">📊 السؤال</span> <span id="currentQ">0</span>/<span id="totalQ">0</span></div>
                </div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div id="questionsContainer"></div>
            <button class="next-btn" id="nextQuestionBtn"><span id="nextText">▶ السؤال التالي</span></button>
        </div>
    </div>

    <footer id="footerText">EduVerse X © 2026 | بنك أسئلة ذكي مترجم بالكامل - أكثر من 200 سؤال</footer>
</div>

<div id="resultModal" class="result-modal">
    <div class="result-card">
        <h2 id="resultTitle">🎉 اكتمل الاختبار!</h2>
        <div class="result-score" id="resultScore">0</div>
        <div class="result-message" id="resultMessage"></div>
        <button class="result-btn" id="newQuizBtn" onclick="closeResult()">🔄 اختبار جديد</button>
        <button class="result-btn" onclick="location.reload()" id="homePageBtn">🏠 الصفحة الرئيسية</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // خلفية ثلاثية الأبعاد
    (function() {
        const canvasBg = document.getElementById('canvas-bg');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a12);
        const cameraBg = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraBg.position.z = 35;
        const rendererBg = new THREE.WebGLRenderer({ canvas: canvasBg, alpha: true });
        rendererBg.setSize(window.innerWidth, window.innerHeight);
        rendererBg.setPixelRatio(window.devicePixelRatio);
        
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 120;
            posArray[i+1] = (Math.random() - 0.5) * 70;
            posArray[i+2] = (Math.random() - 0.5) * 60;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.12, color: 0x4f9cff, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        
        const particlesGeometry2 = new THREE.BufferGeometry();
        const posArray2 = new Float32Array(1200 * 3);
        for(let i = 0; i < 1200 * 3; i += 3) {
            posArray2[i] = (Math.random() - 0.5) * 100;
            posArray2[i+1] = (Math.random() - 0.5) * 60;
            posArray2[i+2] = (Math.random() - 0.5) * 70;
        }
        particlesGeometry2.setAttribute('position', new THREE.BufferAttribute(posArray2, 3));
        const particlesMaterial2 = new THREE.PointsMaterial({ size: 0.08, color: 0xa855f7, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
        const particlesMesh2 = new THREE.Points(particlesGeometry2, particlesMaterial2);
        scene.add(particlesMesh2);
        
        let time = 0;
        function animateBg() {
            requestAnimationFrame(animateBg);
            time += 0.001;
            particlesMesh.rotation.y = time * 0.05;
            particlesMesh.rotation.x = time * 0.03;
            particlesMesh2.rotation.y = -time * 0.04;
            rendererBg.render(scene, cameraBg);
        }
        animateBg();
        window.addEventListener('resize', () => {
            cameraBg.aspect = window.innerWidth / window.innerHeight;
            cameraBg.updateProjectionMatrix();
            rendererBg.setSize(window.innerWidth, window.innerHeight);
        });
    })();

    // ===================== بنك الأسئلة المزدوج (عربي/إنجليزي) =====================
    
    const chemistryLesson1 = {
        ar: [
            { text: "ما هو التعريف الصحيح للعنصر الانتقالي؟", options: ["عنصر له لون مميز", "عنصر يحتوي مدار d غير مكتمل في ذرته أو أيوناته", "عنصر يتفاعل مع الأحماض فقط", "عنصر يوصل الكهرباء بشكل ضعيف"], correct: 1, explanation: "العنصر الانتقالي هو العنصر الذي تحتوي ذرته أو أيوناته على مدار (d) غير مكتمل بالإلكترونات." },
            { text: "أي من التالي يعتبر عنصراً انتقالياً؟", options: ["الصوديوم (Na)", "المغنيسيوم (Mg)", "الكروم (Cr)", "الألومنيوم (Al)"], correct: 2, explanation: "الكروم (Cr) يقع في المجموعة 6 وله مدار d غير مكتمل." },
            { text: "ما هي السلسلة الانتقالية الأولى؟", options: ["من البوتاسيوم K إلى النحاس Cu", "من سكانديوم Sc إلى زنك Zn", "من الكالسيوم Ca إلى النيكل Ni", "من التيتانيوم Ti إلى الجرمانيوم Ge"], correct: 1, explanation: "السلسلة الانتقالية الأولى هي من سكانديوم Sc (21) حتى زنك Zn (30)." },
            { text: "ما العدد الذري للحديد (Fe)؟", options: ["24", "25", "26", "27"], correct: 2, explanation: "الحديد عنصر انتقالي عدده الذري 26." },
            { text: "أي المجموعات تحتوي على عناصر انتقالية؟", options: ["المجموعة 1", "المجموعة 2", "المجموعات 3 إلى 12", "المجموعات 13 إلى 18"], correct: 2, explanation: "العناصر الانتقالية تقع في المجموعات من 3 إلى 12." }
        ],

    function shuffleAndSelectQuestions(questionBankLang, count) {
        const bank = questionBankLang[currentLang];
        if(!bank || bank.length === 0) return [];
        let shuffled = [...bank];
        for(let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        // تأكيد العدد المطلوب بالضبط (بحد أقصى حجم البنك)
        const requested = Math.min(count, shuffled.length);
        return shuffled.slice(0, requested);
    }

    };
    
    function updateLanguage() {
        const t = translations[currentLang];
        document.getElementById('logoText').innerHTML = t.logoText;
        document.getElementById('homeLink').innerHTML = t.homeLink;
        document.getElementById('lessonsLink').innerHTML = t.lessonsLink;
        document.getElementById('quizLink').innerHTML = t.quizLink;
        document.getElementById('contactLink').innerHTML = t.contactLink;
        document.getElementById('heroTitle').innerHTML = t.heroTitle;
        document.getElementById('heroSubtitle').innerHTML = t.heroSubtitle;
        document.getElementById('chemistryText').innerHTML = t.chemistryText;
        document.getElementById('accountingText').innerHTML = t.accountingText;
        document.getElementById('lesson1Btn').querySelector('span').innerHTML = t.lesson1Text;
        document.getElementById('lesson2Btn').querySelector('span').innerHTML = t.lesson2Text;
        document.getElementById('lesson3Btn').querySelector('span').innerHTML = t.lesson3Text;
        document.getElementById('lesson4Btn').querySelector('span').innerHTML = t.lesson4Text;
        document.getElementById('settingsTitle').innerHTML = t.settingsTitle;
        document.getElementById('questionsLabel').innerHTML = t.questionsLabel;
        document.getElementById('difficultyLabel').innerHTML = t.difficultyLabel;
        document.getElementById('easyOption').innerHTML = t.easyOption;
        document.getElementById('mediumOption').innerHTML = t.mediumOption;
        document.getElementById('hardOption').innerHTML = t.hardOption;
        document.getElementById('generateText').innerHTML = t.generateText;
        document.getElementById('scoreLabel').innerHTML = t.scoreLabel;
        document.getElementById('questionLabel').innerHTML = t.questionLabel;
        document.getElementById('nextText').innerHTML = t.nextText;
        document.getElementById('footerText').innerHTML = t.footerText;
        document.getElementById('resultTitle').innerHTML = t.resultTitle;
        document.getElementById('newQuizBtn').innerHTML = t.newQuizBtn;
        document.getElementById('homePageBtn').innerHTML = t.homePageBtn;
        document.getElementById('langToggle').innerHTML = currentLang === 'ar' ? '🇬🇧 English' : '🇸🇦 العربية';
        if(document.getElementById('quizArea').classList.contains('active') && currentQuestions.length > 0) {
            let titleText = "";
            if(currentSubject === 'chemistry') {
                const lessonNames = currentLang === 'ar' ? 
                    {1: "مقدمة العناصر", 2: "خواص العناصر", 3: "التوزيع الإلكتروني", 4: "ألوان الأيونات"} :
                    {1: "Introduction to Elements", 2: "Properties", 3: "Electronic Config", 4: "Colors of Ions"};
                titleText = currentLang === 'ar' ? 
                    `📖 اختبار الكيمياء - ${lessonNames[currentLesson]}` :
                    `📖 Chemistry Quiz - ${lessonNames[currentLesson]}`;
            } else {
                titleText = currentLang === 'ar' ? `📊 اختبار القوائم المالية` : `📊 Financial Statements Quiz`;
            }
            document.getElementById('quizTitle').innerHTML = titleText;
            displayCurrentQuestion();
        }
    }
    
    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        updateLanguage();
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    }
    
    let isDarkMode = true;
    function toggleMode() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('light-mode', !isDarkMode);
        document.getElementById('modeToggle').innerHTML = isDarkMode ? '🌙' : '☀️';
    }
    
    document.getElementById('langToggle').addEventListener('click', toggleLanguage);
    document.getElementById('modeToggle').addEventListener('click', toggleMode);
    document.getElementById('generateQuizBtn').addEventListener('click', startQuiz);
    document.getElementById('nextQuestionBtn').addEventListener('click', nextQuestion);
    window.closeResult = closeResult;
    updateLanguage();
</script>
